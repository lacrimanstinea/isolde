name: Build iOS

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      type-of-release:
        type: string
        required: true
      version:
        type: string
        required: true
      app-identifier:
        type: string
        required: true
      product-name:
        type: string
        required: true

jobs:
  build:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: bun install
      - name: Update app identifier and name
        shell: python
        env:
          APP_IDENTIFIER: ${{ inputs.app-identifier }}
          PRODUCT_NAME: ${{ inputs.product-name }}
        run: |
          import os, json, pathlib

          config_path = pathlib.Path("core/tauri/src-tauri/tauri.conf.json")
          data = json.loads(config_path.read_text(encoding="utf-8"))

          data["identifier"] = os.environ["APP_IDENTIFIER"]
          data["productName"] = os.environ["PRODUCT_NAME"]

          config_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
      - name: Set app version
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' core/tauri/src-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp core/tauri/src-tauri/tauri.conf.json
      - name: Initialize iOS Project
        shell: bash
        run: |
          cd core/tauri/src-tauri
          rm -rf gen/apple
          bun run tauri ios init
      - name: Regenerate Icons
        run: |
          cd core/tauri/src-tauri
          INPUT_TYPE="${{ inputs.type-of-release }}"
          ICON_TYPE="$INPUT_TYPE"

          if [ "$INPUT_TYPE" = "stable" ]; then
            ICON_TYPE="release"
          elif [ -z "$ICON_TYPE" ]; then
            ICON_TYPE="preview"
          fi

          echo "Attempting to generate icons for type: $ICON_TYPE"
          if ! bun --filter @isolde/tauri icon:$ICON_TYPE; then
            echo "::warning::Icon target 'icon:$ICON_TYPE' failed or does not exist. Falling back to icon:preview."
            bun --filter @isolde/tauri icon:preview
          fi
      - name: Build iOS App
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
          VITE_TYPE_OF_RELEASE: "${{ inputs.type-of-release }}"
        run: |
          cd core/tauri/src-tauri
          bun run tauri ios build --no-sign
      - id: find-ios
        run: |
          IPA_PATH=$(find core/tauri/src-tauri/gen/apple -name "*.ipa" 2>/dev/null | head -1 || echo "")
          APP_PATH=$(find core/tauri/src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1 || echo "")
          if [ -n "$IPA_PATH" ]; then
            echo "found-ipa=true" >> $GITHUB_OUTPUT
            echo "ipa-path=$IPA_PATH" >> $GITHUB_OUTPUT
          elif [ -n "$APP_PATH" ]; then
            echo "found-app=true" >> $GITHUB_OUTPUT
            echo "app-path=$APP_PATH" >> $GITHUB_OUTPUT
          else
            echo "found-app=false" >> $GITHUB_OUTPUT
            echo "found-ipa=false" >> $GITHUB_OUTPUT
          fi
      - name: Package .app into .ipa if needed
        if: steps.find-ios.outputs.found-app == 'true' && steps.find-ios.outputs.found-ipa != 'true'
        run: |
          mkdir -p Payload
          cp -r "${{ steps.find-ios.outputs.app-path }}" Payload/
          zip -r isolde-ios-unsigned.ipa Payload
          rm -rf Payload
          mkdir -p core/tauri/src-tauri/gen/apple/build
          mv isolde-ios-unsigned.ipa core/tauri/src-tauri/gen/apple/build/
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            core/tauri/src-tauri/gen/apple/**/*.ipa
            core/tauri/src-tauri/gen/apple/**/*.app
