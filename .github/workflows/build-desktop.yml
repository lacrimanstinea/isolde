name: Build Desktop

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      type-of-release:
        type: string
        required: true
      version:
        type: string
        required: true
      app-identifier:
        type: string
        required: true
      product-name:
        type: string
        required: true
    outputs:
      latest-json-path:
        description: "Path to the generated latest.json"
        value: ${{ jobs.generate-manifest.outputs.latest-json }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            artifact-name: macos-universal
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-cmd: bun --filter @isolde/tauri tauri build --target universal-apple-darwin
            artifact-path: |
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - platform: linux
            os: ubuntu-latest
            artifact-name: linux
            targets: ""
            build-cmd: bun --filter @isolde/tauri tauri build
            artifact-path: |
              core/tauri/src-tauri/target/release/bundle/deb/*.deb
              core/tauri/src-tauri/target/release/bundle/deb/*.deb.sig
              core/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
              core/tauri/src-tauri/target/release/bundle/appimage/*.AppImage.sig
              core/tauri/src-tauri/target/release/bundle/rpm/*.rpm
              core/tauri/src-tauri/target/release/bundle/rpm/*.rpm.sig
          - platform: windows
            os: windows-latest
            artifact-name: windows
            targets: ""
            build-cmd: bun --filter @isolde/tauri tauri build
            artifact-path: |
              core/tauri/src-tauri/target/release/bundle/msi/*.msi
              core/tauri/src-tauri/target/release/bundle/msi/*.msi.sig
              core/tauri/src-tauri/target/release/bundle/nsis/*.exe
              core/tauri/src-tauri/target/release/bundle/nsis/*.exe.sig
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - run: bun install
      - name: Patch tauri.conf.json
        uses: ./.github/actions/patch-tauri-config
        with:
          app-identifier: ${{ inputs.app-identifier }}
          product-name: ${{ inputs.product-name }}
          version: ${{ inputs.version }}
          type-of-release: ${{ inputs.type-of-release }}
          set-updater-endpoint: "true"
      - name: Regenerate Icons
        uses: ./.github/actions/regen-icons
        with:
          type-of-release: ${{ inputs.type-of-release }}
      - name: Build Application
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ matrix.build-cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  generate-manifest:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      latest-json: ${{ steps.gen.outputs.latest-json }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-latest-json
        run: cargo install tauri-latest-json

      - name: Generate latest.json
        id: gen
        run: |
          mkdir -p core/tauri/src-tauri/target/release/bundle/
          mkdir -p core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/

          cp -r downloaded-artifacts/windows/* core/tauri/src-tauri/target/release/bundle/ 2>/dev/null || true
          cp -r downloaded-artifacts/linux/* core/tauri/src-tauri/target/release/bundle/ 2>/dev/null || true
          cp -r downloaded-artifacts/macos-universal/* core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/ 2>/dev/null || true

          if [ "${{ inputs.type-of-release }}" = "stable" ] || [ "${{ inputs.type-of-release }}" = "release" ]; then
            TAG="latest"
          else
            TAG="v${{ inputs.version }}-${{ inputs.type-of-release }}"
          fi

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"

          cd core/tauri/src-tauri
          tauri-latest-json "$BASE_URL" "See GitHub releases page for release notes."
          mv latest.json ../../../latest.json
          cd ../../..

          echo "latest-json=latest.json" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-latest-json
          path: latest.json
          retention-days: 1
