name: Build Desktop

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      version:
        type: string
        required: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            artifact-name: macos-universal
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-cmd: VITE_APP_VERSION=${{ inputs.version }} bun --filter @isolde/tauri tauri build --target universal-apple-darwin
            artifact-path: |
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: linux
            os: ubuntu-latest
            artifact-name: linux
            targets: ""
            build-cmd: VITE_APP_VERSION=${{ inputs.version }} bun --filter @isolde/tauri tauri build
            artifact-path: |
              core/tauri/src-tauri/target/release/bundle/deb/*.deb
              core/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
              core/tauri/src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows
            os: windows-latest
            artifact-name: windows
            targets: ""
            build-cmd: $env:VITE_APP_VERSION="${{ inputs.version }}"; bun --filter @isolde/tauri tauri build
            artifact-path: |
              core/tauri/src-tauri/target/release/bundle/msi/*.msi
              core/tauri/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - run: bun install
      - name: Set app version
        shell: bash
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' core/tauri/src-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp core/tauri/src-tauri/tauri.conf.json
      - name: Patch Bundle ID and Name (POSIX)
        if: "!inputs.is-release && matrix.platform != 'windows'"
        run: |
          sed -i '' 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/src-tauri/tauri.conf.json 2>/dev/null || \
          sed -i 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/src-tauri/tauri.conf.json
          sed -i '' 's/"productName": "isolde"/"productName": "isoldeP"/g' core/tauri/src-tauri/tauri.conf.json 2>/dev/null || \
          sed -i 's/"productName": "isolde"/"productName": "isoldeP"/g' core/tauri/src-tauri/tauri.conf.json
      - name: Patch Bundle ID and Name (Windows)
        if: "!inputs.is-release && matrix.platform == 'windows'"
        shell: pwsh
        run: |
          (Get-Content core/tauri/src-tauri/tauri.conf.json) -replace '"identifier": "com.lacrimanstinea.isolde"', '"identifier": "com.lacrimanstinea.isolde.preview"' -replace '"productName": "isolde"', '"productName": "isoldeP"' | Set-Content core/tauri/src-tauri/tauri.conf.json
      - name: Build Application
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
        run: ${{ matrix.build-cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}