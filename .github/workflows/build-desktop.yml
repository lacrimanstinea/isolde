name: Build Desktop

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      type-of-release:
        type: string
        required: true
      version:
        type: string
        required: true
      app-identifier:
        type: string
        required: true
      product-name:
        type: string
        required: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            artifact-name: macos-universal
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-cmd: bun --filter @isolde/tauri tauri build --target universal-apple-darwin
            artifact-path: |
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              core/tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: linux
            os: ubuntu-latest
            artifact-name: linux
            targets: ""
            build-cmd: bun --filter @isolde/tauri tauri build
            artifact-path: |
              core/tauri/src-tauri/target/release/bundle/deb/*.deb
              core/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
              core/tauri/src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows
            os: windows-latest
            artifact-name: windows
            targets: ""
            build-cmd: bun --filter @isolde/tauri tauri build
            artifact-path: |
              core/tauri/src-tauri/target/release/bundle/msi/*.msi
              core/tauri/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - run: bun install
      - name: Update app identifier and name
        shell: python
        env:
          APP_IDENTIFIER: ${{ inputs.app-identifier }}
          PRODUCT_NAME: ${{ inputs.product-name }}
        run: |
          import os, json, pathlib

          config_path = pathlib.Path("core/tauri/src-tauri/tauri.conf.json")
          data = json.loads(config_path.read_text(encoding="utf-8"))

          data["identifier"] = os.environ["APP_IDENTIFIER"]
          data["productName"] = os.environ["PRODUCT_NAME"]

          config_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
      - name: Set app version
        shell: bash
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' core/tauri/src-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp core/tauri/src-tauri/tauri.conf.json
      - name: Regenerate Icons
        shell: bash
        run: |
          cd core/tauri/src-tauri
          INPUT_TYPE="${{ inputs.type-of-release }}"
          ICON_TYPE="$INPUT_TYPE"

          if [ "$INPUT_TYPE" = "stable" ]; then
            ICON_TYPE="release"
          elif [ -z "$ICON_TYPE" ]; then
            ICON_TYPE="preview"
          fi

          echo "Attempting to generate icons for type: $ICON_TYPE"
          if ! bun --filter @isolde/tauri icon:$ICON_TYPE; then
            echo "::warning::Icon target 'icon:$ICON_TYPE' failed or does not exist. Falling back to icon:preview."
            bun --filter @isolde/tauri icon:preview
          fi
      - name: Create env file for app version and release state
        shell: python
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
          VITE_TYPE_OF_RELEASE: '${{ inputs.type-of-release }}'
        run: |
          import os, pathlib

          env_path = pathlib.Path("core/app/.env")
          env_path.parent.mkdir(parents=True, exist_ok=True)

          content = f"VITE_APP_VERSION={os.environ['VITE_APP_VERSION']}\nVITE_IS_RELEASE={os.environ['VITE_IS_RELEASE']}\n"
          env_path.write_text(content, encoding="utf-8")
      - name: Build Application
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
        run: ${{ matrix.build-cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
