name: Build Desktop

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      type-of-release:
        type: string
        required: true
      version:
        type: string
        required: true
      app-identifier:
        type: string
        required: true
      product-name:
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: linux
            os: ubuntu-latest
            targets: ""
            args: ""
          - platform: windows
            os: windows-latest
            targets: ""
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - run: bun install

      - name: Patch tauri.conf.json
        uses: ./.github/actions/patch-tauri-config
        with:
          app-identifier: ${{ inputs.app-identifier }}
          product-name: ${{ inputs.product-name }}
          version: ${{ inputs.version }}
          type-of-release: ${{ inputs.type-of-release }}
          set-updater-endpoint: "true"

      - name: Regenerate Icons
        uses: ./.github/actions/regen-icons
        with:
          type-of-release: ${{ inputs.type-of-release }}

      - name: Create env file for app version and release state
        shell: python
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
        run: |
          import os, pathlib

          env_path = pathlib.Path("core/app/.env")
          env_path.parent.mkdir(parents=True, exist_ok=True)

          content = f"VITE_APP_VERSION={os.environ['VITE_APP_VERSION']}\nVITE_IS_RELEASE={os.environ['VITE_IS_RELEASE']}\n"
          env_path.write_text(content, encoding="utf-8")

      - name: Compute tag and release name
        id: release-meta
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          IS_RELEASE="${{ inputs.is-release }}"
          TYPE_OF_RELEASE="${{ inputs.type-of-release }}"

          if [ "$IS_RELEASE" == "true" ]; then
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
            echo "release-name=isolde ${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tag-name=v${VERSION}-${TYPE_OF_RELEASE}" >> $GITHUB_OUTPUT
            echo "release-name=isolde ${VERSION}-${TYPE_OF_RELEASE}" >> $GITHUB_OUTPUT
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
        with:
          projectPath: core/tauri
          tagName: ${{ steps.release-meta.outputs.tag-name }}
          releaseName: ${{ steps.release-meta.outputs.release-name }}
          releaseDraft: true
          prerelease: ${{ inputs.is-release != true }}
          args: ${{ matrix.args }}
