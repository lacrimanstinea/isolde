name: Build Desktop

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      type-of-release:
        type: string
        required: true
      version:
        type: string
        required: true
      app-identifier:
        type: string
        required: true
      product-name:
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: linux
            os: ubuntu-latest
            targets: ""
            args: ""
          - platform: windows
            os: windows-latest
            targets: ""
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - run: bun install

      - name: Update app identifier, name, version, updater endpoint
        shell: python
        env:
          APP_IDENTIFIER: ${{ inputs.app-identifier }}
          PRODUCT_NAME: ${{ inputs.product-name }}
          VERSION: ${{ inputs.version }}
          TYPE_OF_RELEASE: ${{ inputs.type-of-release }}
        run: |
          import os, json, pathlib

          config_path = pathlib.Path("core/tauri/src-tauri/tauri.conf.json")
          data = json.loads(config_path.read_text(encoding="utf-8"))

          data["identifier"] = os.environ["APP_IDENTIFIER"]
          data["productName"] = os.environ["PRODUCT_NAME"]
          data["version"] = os.environ["VERSION"]

          type_of_release = os.environ["TYPE_OF_RELEASE"]
          if type_of_release == "stable":
              endpoint = "https://github.com/lacrimanstinea/isolde/releases/latest/download/latest.json"
          else:
              endpoint = f"https://github.com/lacrimanstinea/isolde/releases/download/{type_of_release}/latest.json"

          data["plugins"]["updater"]["endpoints"] = [endpoint]

          config_path.write_text(json.dumps(data, indent=2), encoding="utf-8")

      - name: Regenerate Icons
        shell: bash
        run: |
          cd core/tauri/src-tauri
          INPUT_TYPE="${{ inputs.type-of-release }}"
          ICON_TYPE="$INPUT_TYPE"

          if [ "$INPUT_TYPE" = "stable" ]; then
            ICON_TYPE="release"
          elif [ -z "$ICON_TYPE" ]; then
            ICON_TYPE="preview"
          fi

          echo "Attempting to generate icons for type: $ICON_TYPE"
          if ! bun --filter @isolde/tauri icon:$ICON_TYPE; then
            echo "::warning::Icon target 'icon:$ICON_TYPE' failed or does not exist. Falling back to icon:preview."
            bun --filter @isolde/tauri icon:preview
          fi

      - name: Create env file for app version and release state
        shell: python
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
        run: |
          import os, pathlib

          env_path = pathlib.Path("core/app/.env")
          env_path.parent.mkdir(parents=True, exist_ok=True)

          content = f"VITE_APP_VERSION={os.environ['VITE_APP_VERSION']}\nVITE_IS_RELEASE={os.environ['VITE_IS_RELEASE']}\n"
          env_path.write_text(content, encoding="utf-8")

      - name: Compute tag and release name
        id: release-meta
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          IS_RELEASE="${{ inputs.is-release }}"
          TYPE_OF_RELEASE="${{ inputs.type-of-release }}"

          if [ "$IS_RELEASE" == "true" ]; then
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
            echo "release-name=isolde ${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tag-name=v${VERSION}-${TYPE_OF_RELEASE}" >> $GITHUB_OUTPUT
            echo "release-name=isolde ${VERSION}-${TYPE_OF_RELEASE}" >> $GITHUB_OUTPUT
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
        with:
          projectPath: core/tauri
          tagName: ${{ steps.release-meta.outputs.tag-name }}
          releaseName: ${{ steps.release-meta.outputs.release-name }}
          releaseDraft: true
          prerelease: ${{ inputs.is-release != true }}
          args: ${{ matrix.args }}
