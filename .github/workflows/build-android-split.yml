name: Build Android Split

on:
  workflow_call:
    inputs:
      is-release:
        type: boolean
        required: true
      version:
        type: string
        required: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust-target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7
            rust-target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: x86_64
            rust-target: x86_64-linux-android
            abi: x86_64
          - target: i686
            rust-target: i686-linux-android
            abi: x86
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
      - run: bun install
      - name: Update app identifier and name based on release state
        run: |
          if [ "${{ inputs.is-release }}" == "true" ]; then
            sed -i 's/"identifier": "com.lacrimanstinea.isolde.development"/"identifier": "com.lacrimanstinea.isolde"/g' core/tauri/src-tauri/tauri.conf.json
            sed -i 's/"productName": "isoldeD"/"productName": "isolde"/g' core/tauri/src-tauri/tauri.conf.json
          else
            sed -i 's/"identifier": "com.lacrimanstinea.isolde.development"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/src-tauri/tauri.conf.json
            sed -i 's/"productName": "isoldeD"/"productName": "isoldeP"/g' core/tauri/src-tauri/tauri.conf.json
          fi
      - name: Set app version
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' core/tauri/src-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp core/tauri/src-tauri/tauri.conf.json
      - name: Initialize Android Project and Regenerate Icons
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
        run: |
          cd core/tauri/src-tauri
          rm -rf gen/android
          bun run tauri android init
          if [ "${{ inputs.is-release }}" == "true" ]; then
            bun --filter @isolde/tauri icon:release
          else
            bun --filter @isolde/tauri icon:preview
          fi
      - name: Patch AndroidManifest.xml Activity Label
        run: |
          python3 -c '
          import pathlib
          manifest_path = pathlib.Path("core/tauri/src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          content = manifest_path.read_text()
          content = content.replace("android:label=\"@string/main_activity_title\"", "android:label=\"@string/app_name\"")
          manifest_path.write_text(content)
          '
      - name: Create env file for app version and release state
        run: |
          echo "VITE_APP_VERSION=${{ inputs.version }}" >> core/app/.env
          echo "VITE_IS_RELEASE=${{ inputs.is-release }}" >> core/app/.env
      - name: Create keystore for signing
        run: |
          mkdir -p core/tauri/src-tauri/gen/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > core/tauri/src-tauri/gen/android/release.keystore
          cat > core/tauri/src-tauri/gen/android/key.properties << EOF
          storeFile=release.keystore
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Wire up release signing config
        run: |
          cd core/tauri/src-tauri
          python3 - << 'EOF'
          import re, pathlib
          p = pathlib.Path("gen/android/app/build.gradle.kts")
          content = p.read_text()

          content = content.replace(
              "import java.util.Properties",
              "import java.util.Properties\nimport java.io.FileInputStream",
              1
          )

          signing_block = '''
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("key.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }
          '''

          content = re.sub(r"(android \{\n)", r"\1" + signing_block, content, count=1)

          content = content.replace(
              'getByName("release") {',
              'getByName("release") {\n          signingConfig = signingConfigs.getByName("release")',
              1
          )

          if "signingConfigs.getByName(\"release\")" not in content:
              raise SystemExit("Failed to wire up signing config - check build.gradle.kts structure")

          p.write_text(content)
          EOF
      - name: Patch build.gradle.kts for Single Architecture
        run: |
          cd core/tauri/src-tauri
          echo "" >> gen/android/app/build.gradle.kts
          cat >> gen/android/app/build.gradle.kts << 'PATCH'
          android {
              defaultConfig {
                  ndk {
                      abiFilters.clear()
                      abiFilters.add("${{ matrix.abi }}")
                  }
              }
          }
          PATCH
      - name: Build for single architecture
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_IS_RELEASE: ${{ inputs.is-release }}
        run: |
          cd core/tauri/src-tauri
          bun run tauri android build --apk --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}
          path: |
            core/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
