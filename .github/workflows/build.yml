name: Build Isolde

on:
  push:
    branches:
      - main
      - preview
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - preview

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.vars.outputs.is-release }}
      app-identifier: ${{ steps.vars.outputs.app-identifier }}
      version: ${{ steps.vars.outputs.version }}
      tag-name: ${{ steps.vars.outputs.tag-name }}
      product-name: ${{ steps.vars.outputs.product-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
            echo "product-name=isolde" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde.preview" >> $GITHUB_OUTPUT
            echo "product-name=isoldeP" >> $GITHUB_OUTPUT

            LATEST_TAG=$(git tag -l "v[0-9]*" --sort=-v:refname | grep -v "preview" | head -n 1)

            if [ -n "$LATEST_TAG" ]; then
              BASE_VERSION="${LATEST_TAG#v}"
              MAJOR_MINOR=$(echo "$BASE_VERSION" | awk -F'.' '{print $1 "." $2}')
              if [ -z "$MAJOR_MINOR" ]; then
                MAJOR_MINOR="0.0"
              fi
              COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
              VERSION="${MAJOR_MINOR}.${COMMITS_SINCE}"
            else
              COMMITS_SINCE=$(git rev-list --count HEAD)
              VERSION="0.0.${COMMITS_SINCE}"
            fi

            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

  build-desktop:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      version: ${{ needs.prepare.outputs.version }}

  build-android-split:
    needs: prepare
    uses: ./.github/workflows/build-android-split.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-android-universal:
    needs: prepare
    uses: ./.github/workflows/build-android-universal.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-ios:
    needs: prepare
    uses: ./.github/workflows/build-ios.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      version: ${{ needs.prepare.outputs.version }}

  release:
    needs:
      - prepare
      - build-desktop
      - build-android-split
      - build-android-universal
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - run: |
          mkdir -p release
          VERSION="${{ needs.prepare.outputs.version }}"
          PROD="${{ needs.prepare.outputs.product-name }}"
          PREFIX="${PROD// / }"

          find artifacts/macos-universal -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/linux -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/windows -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release/ \; 2>/dev/null || true

          for arch in aarch64 armv7 x86_64 i686; do
            apk=$(find "artifacts/android-${arch}" -type f -name "*.apk" -print -quit 2>/dev/null || true)
            if [ -n "$apk" ]; then
              dest_arch="$arch"
              if [ "$arch" = "aarch64" ]; then
                dest_arch="arm64-v8a"
              elif [ "$arch" = "armv7" ]; then
                dest_arch="armeabi-v7a"
              elif [ "$arch" = "x86_64" ]; then
                dest_arch="x86_64"
              elif [ "$arch" = "i686" ]; then
                dest_arch="x86"
              fi
              cp "$apk" "release/${PREFIX}-android-${dest_arch}_${VERSION}.apk"
            fi
          done

          apk=$(find artifacts/android-universal -type f -name "*.apk" -print -quit 2>/dev/null || true)
          if [ -n "$apk" ]; then
            cp "$apk" "release/${PREFIX}-android-universal_${VERSION}.apk"
          fi

          ipa=$(find artifacts/ios -type f -name "*.ipa" -print -quit 2>/dev/null || true)
          if [ -n "$ipa" ]; then
            cp "$ipa" "release/${PREFIX}-ios_${VERSION}.ipa"
          fi

          app=$(find artifacts/ios -type f -name "*.app" -print -quit 2>/dev/null || true)
          if [ -n "$app" ]; then
            cp "$app" "release/${PREFIX}-ios_${VERSION}.app"
          fi

      - name: Set up Android build-tools
        uses: android-actions/setup-android@v3

      - name: Verify all APKs are release-signed
        run: |
          sdkmanager "build-tools;34.0.0"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          shopt -s nullglob
          for apk in release/*.apk; do
            echo "== Verifying $apk =="
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Determine Tag and Release Name
        id: release-meta
        run: |
          if [ "${{ needs.prepare.outputs.is-release }}" == "true" ]; then
            echo "tag-name=v${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT
            echo "release-name=Isolde ${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag-name=v${{ needs.prepare.outputs.version }}-preview" >> $GITHUB_OUTPUT
            echo "release-name=Isolde ${{ needs.prepare.outputs.version }}-preview" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release-meta.outputs.release-name }}
          tag_name: ${{ steps.release-meta.outputs.tag-name }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.is-release != 'true' }}
          make_latest: ${{ needs.prepare.outputs.is-release == 'true' }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: gh release edit "${{ steps.release-meta.outputs.tag-name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
