name: Build Isolde

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.vars.outputs.is-release }}
      type-of-release: ${{ steps.vars.outputs.type-of-release }}
      app-identifier: ${{ steps.vars.outputs.app-identifier }}
      version: ${{ steps.vars.outputs.version }}
      tag-name: ${{ steps.vars.outputs.tag-name }}
      product-name: ${{ steps.vars.outputs.product-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag and extract version/suffix
        id: parse-ref
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_REF="${{ github.ref_name }}"
            VERSION=$(echo "$RAW_REF" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            SUFFIX=$(echo "$RAW_REF" | sed -E 's/v[0-9]+\.[0-9]+\.[0-9]+(-)?//')
            echo "is-tag=true" >> $GITHUB_OUTPUT
            echo "raw-ref=$RAW_REF" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          else
            echo "is-tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Get identifiers from tag
        id: tag-vars
        if: steps.parse-ref.outputs.is-tag == 'true'
        run: |
          SUFFIX="${{ steps.parse-ref.outputs.suffix }}"
          VERSION="${{ steps.parse-ref.outputs.version }}"

          if [ -n "$SUFFIX" ]; then
            if [ "$SUFFIX" = "stable" ] || [ "$SUFFIX" = "release" ]; then
              echo "type-of-release=stable" >> $GITHUB_OUTPUT
              echo "is-release=true" >> $GITHUB_OUTPUT
              echo "app-identifier=com.lacrimanstinea.isolde" >> $GITHUB_OUTPUT
              echo "product-name=isolde" >> $GITHUB_OUTPUT
              echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
            else
              echo "type-of-release=$SUFFIX" >> $GITHUB_OUTPUT
              echo "is-release=false" >> $GITHUB_OUTPUT
              echo "app-identifier=com.lacrimanstinea.isolde.$SUFFIX" >> $GITHUB_OUTPUT
              echo "product-name=isolde$(echo "$SUFFIX" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')" >> $GITHUB_OUTPUT
              echo "tag-name=v${VERSION}-${SUFFIX}" >> $GITHUB_OUTPUT
            fi
          else
            echo "type-of-release=stable" >> $GITHUB_OUTPUT
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde" >> $GITHUB_OUTPUT
            echo "product-name=isolde" >> $GITHUB_OUTPUT
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get latest version tag for preview build
        id: latest-tag
        if: steps.parse-ref.outputs.is-tag == 'false'
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-(stable|release))?$' | head -n 1)
          echo "latest-tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Increment patch version for preview build based on last version tag
        id: preview-version
        if: steps.parse-ref.outputs.is-tag == 'false'
        run: |
          LATEST_TAG="${{ steps.latest-tag.outputs.latest-tag }}"

          if [ -n "$LATEST_TAG" ]; then
            BASE_VERSION=$(echo "$LATEST_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            MAJOR_MINOR=$(echo "$BASE_VERSION" | awk -F'.' '{print $1 "." $2}')
            PATCH=$(echo "$BASE_VERSION" | awk -F'.' '{print $3}')
            if [ -z "$MAJOR_MINOR" ]; then
              MAJOR_MINOR="0.0"
            fi
            if [ -z "$PATCH" ]; then
              PATCH="0"
            fi
            COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            NEW_PATCH=$(( PATCH + COMMITS_SINCE ))
            VERSION="${MAJOR_MINOR}.${NEW_PATCH}"
          else
            COMMITS_SINCE=$(git rev-list --count HEAD)
            VERSION="0.0.${COMMITS_SINCE}"
          fi

          echo "type-of-release=preview" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag-name=v${VERSION}-preview" >> $GITHUB_OUTPUT
          echo "is-release=false" >> $GITHUB_OUTPUT
          echo "app-identifier=com.lacrimanstinea.isolde.preview" >> $GITHUB_OUTPUT
          echo "product-name=isoldeP" >> $GITHUB_OUTPUT

      - name: Define variables for tagged/preview builds
        id: vars
        run: |
          if [ "${{ steps.parse-ref.outputs.is-tag }}" == "true" ]; then
            echo "is-release=${{ steps.tag-vars.outputs.is-release }}" >> $GITHUB_OUTPUT
            echo "type-of-release=${{ steps.tag-vars.outputs.type-of-release }}" >> $GITHUB_OUTPUT
            echo "app-identifier=${{ steps.tag-vars.outputs.app-identifier }}" >> $GITHUB_OUTPUT
            echo "product-name=${{ steps.tag-vars.outputs.product-name }}" >> $GITHUB_OUTPUT
            echo "version=${{ steps.tag-vars.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag-name=${{ steps.tag-vars.outputs.tag-name }}" >> $GITHUB_OUTPUT
          else
            echo "is-release=${{ steps.preview-version.outputs.is-release }}" >> $GITHUB_OUTPUT
            echo "type-of-release=${{ steps.preview-version.outputs.type-of-release }}" >> $GITHUB_OUTPUT
            echo "app-identifier=${{ steps.preview-version.outputs.app-identifier }}" >> $GITHUB_OUTPUT
            echo "product-name=${{ steps.preview-version.outputs.product-name }}" >> $GITHUB_OUTPUT
            echo "version=${{ steps.preview-version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag-name=${{ steps.preview-version.outputs.tag-name }}" >> $GITHUB_OUTPUT
          fi

  build-desktop:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      type-of-release: ${{ needs.prepare.outputs.type-of-release }}
      version: ${{ needs.prepare.outputs.version }}
      app-identifier: ${{ needs.prepare.outputs.app-identifier }}
      product-name: ${{ needs.prepare.outputs.product-name }}
    secrets: inherit

  build-android:
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      type-of-release: ${{ needs.prepare.outputs.type-of-release }}
      version: ${{ needs.prepare.outputs.version }}
      app-identifier: ${{ needs.prepare.outputs.app-identifier }}
      product-name: ${{ needs.prepare.outputs.product-name }}
    secrets: inherit

  build-ios:
    needs: prepare
    uses: ./.github/workflows/build-ios.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
      type-of-release: ${{ needs.prepare.outputs.type-of-release }}
      version: ${{ needs.prepare.outputs.version }}
      app-identifier: ${{ needs.prepare.outputs.app-identifier }}
      product-name: ${{ needs.prepare.outputs.product-name }}

  release:
    needs:
      - prepare
      - build-desktop
      - build-android
      - build-ios
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Save Android per-arch APKs and rename to common naming conventions
        run: |
          mkdir -p release
          VERSION="${{ needs.prepare.outputs.version }}"
          PROD="${{ needs.prepare.outputs.product-name }}"
          PREFIX="${PROD// / }"

          for arch in aarch64 armv7 x86_64 i686; do
            apk=$(find "artifacts/android-split-${arch}" -type f -name "*.apk" -print -quit 2>/dev/null || true)
            if [ -z "$apk" ]; then
              apk=$(find "artifacts/android-${arch}" -type f -name "*.apk" -print -quit 2>/dev/null || true)
            fi
            if [ -n "$apk" ]; then
              dest_arch="$arch"
              [ "$arch" = "aarch64" ] && dest_arch="arm64-v8a"
              [ "$arch" = "armv7" ] && dest_arch="armeabi-v7a"
              [ "$arch" = "i686" ] && dest_arch="x86"
              cp "$apk" "release/${PREFIX}-android-${dest_arch}_${VERSION}.apk"
            fi
          done

      - name: Save Android universal APK
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PROD="${{ needs.prepare.outputs.product-name }}"
          PREFIX="${PROD// / }"
          apk=$(find artifacts/android-universal -type f -name "*.apk" -print -quit 2>/dev/null || true)
          [ -n "$apk" ] && cp "$apk" "release/${PREFIX}-android-universal_${VERSION}.apk"

      - name: Save iOS artifacts
        run: |
          mkdir -p release
          VERSION="${{ needs.prepare.outputs.version }}"
          PROD="${{ needs.prepare.outputs.product-name }}"
          PREFIX="${PROD// / }"
          ipa=$(find artifacts -type f -name "*.ipa" -print -quit 2>/dev/null || true)
          if [ -n "$ipa" ]; then
            cp "$ipa" "release/${PREFIX}-ios_${VERSION}.ipa"
          fi
          app=$(find artifacts -type d -name "*.app" -print -quit 2>/dev/null || true)
          if [ -n "$app" ]; then
            cp -R "$app" "release/${PREFIX}-ios_${VERSION}.app"
          fi

      - name: Save Desktop artifacts
        run: |
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.msi" -o -name "*.exe" -o -name "*.sig" \) -exec cp {} release/ \;

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-latest-json
        run: cargo install tauri-latest-json

      - name: Set up Android build-tools
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "build-tools;34.0.0"

      - name: Verify all APKs are release-signed
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          shopt -s nullglob
          for apk in release/*.apk; do
            echo "== Verifying $apk =="
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - uses: softprops/action-gh-release@v2
        with:
          name: isolde ${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.is-release != 'true' && format('-{0}', needs.prepare.outputs.type-of-release) || '' }}
          tag_name: ${{ needs.prepare.outputs.tag-name }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.is-release != 'true' }}
          make_latest: ${{ needs.prepare.outputs.is-release == 'true' }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: gh release edit "${{ needs.prepare.outputs.tag-name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling channel with latest.json
        if: needs.prepare.outputs.is-release != 'true'
        run: |
          CHANNEL="${{ needs.prepare.outputs.type-of-release }}"

          gh release view "$CHANNEL" >/dev/null 2>&1 || \
          gh release create "$CHANNEL" \
            --title "isolde ($CHANNEL channel)" \
            --notes "Rolling channel holding the latest $CHANNEL auto-update manifest." \
            --prerelease

          # download the latest.json from build-desktop
          gh release download "${{ needs.prepare.outputs.tag-name }}" -p "latest.json" -O release/latest.json || \
          echo "Warning: latest.json not found in release"

          gh release upload "$CHANNEL" release/latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
