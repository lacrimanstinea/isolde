name: Build Isolde

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.vars.outputs.is-release }}
      app-identifier: ${{ steps.vars.outputs.app-identifier }}
      version: ${{ steps.vars.outputs.version }}
      tag-name: ${{ steps.vars.outputs.tag-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde.preview" >> $GITHUB_OUTPUT

            LATEST_TAG=$(git tag -l "v[0-9]*" --sort=-v:refname | grep -v "preview" | head -n 1)

            if [ -n "$LATEST_TAG" ]; then
              BASE_VERSION="${LATEST_TAG#v}"
              COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
              VERSION="${BASE_VERSION}-preview.${COMMITS_SINCE}"
            else
              COMMITS_SINCE=$(git rev-list --count HEAD)
              VERSION="0.0-preview.${COMMITS_SINCE}"
            fi

            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag-name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

  build-desktop:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}

  build-android-split:
    needs: prepare
    uses: ./.github/workflows/build-android-split.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
    secrets: inherit

  build-android-universal:
    needs: prepare
    uses: ./.github/workflows/build-android-universal.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}
    secrets: inherit

  build-ios:
    needs: prepare
    uses: ./.github/workflows/build-ios.yml
    with:
      is-release: ${{ needs.prepare.outputs.is-release == 'true' }}

  release:
    needs:
      - prepare
      - build-desktop
      - build-android-split
      - build-android-universal
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - run: |
          mkdir -p release
          find artifacts/macos-universal -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/linux -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/windows -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/android-universal -type f -name "*.apk" -exec cp {} release/isolde-android-universal.apk \; 2>/dev/null || true
          for arch in aarch64 armv7 x86_64 i686; do
            find "artifacts/android-${arch}" -type f -name "*.apk" -exec cp {} release/isolde-android-${arch}.apk \; 2>/dev/null || true
          done
          find artifacts/ios -type f \( -name "*.ipa" -o -name "*.app" \) -exec cp {} release/ \; 2>/dev/null || true

      - uses: softprops/action-gh-release@v2
        with:
          name: Isolde ${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.tag-name }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.is-release != 'true' }}
          make_latest: ${{ needs.prepare.outputs.is-release == 'true' }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: gh release edit "${{ needs.prepare.outputs.tag-name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
