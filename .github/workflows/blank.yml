name: Build Isolde

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.vars.outputs.is-release }}
      app-identifier: ${{ steps.vars.outputs.app-identifier }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde" >> $GITHUB_OUTPUT
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "app-identifier=com.lacrimanstinea.isolde.preview" >> $GITHUB_OUTPUT
            echo "version=0.0.0-preview.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: bun install
      - if: needs.prepare.outputs.is-release != 'true'
        run: |
          sed -i '' 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/tauri.conf.json
      - run: bun --filter @isolde/tauri tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            core/tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            core/tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: bun install
      - if: needs.prepare.outputs.is-release != 'true'
        run: |
          sed -i 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/tauri.conf.json
      - run: bun --filter @isolde/tauri tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            core/tauri/target/release/bundle/deb/*.deb
            core/tauri/target/release/bundle/appimage/*.AppImage
            core/tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: bun install
      - if: needs.prepare.outputs.is-release != 'true'
        shell: pwsh
        run: |
          (Get-Content core/tauri/tauri.conf.json) -replace '"identifier": "com.lacrimanstinea.isolde"', '"identifier": "com.lacrimanstinea.isolde.preview"' | Set-Content core/tauri/tauri.conf.json
      - run: bun --filter @isolde/tauri tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            core/tauri/target/release/bundle/msi/*.msi
            core/tauri/target/release/bundle/nsis/*.exe

  build-android-split:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64
            rust-target: aarch64-linux-android
            gradle-arch: arm64-v8a
          - target: armv7
            rust-target: armv7-linux-androideabi
            gradle-arch: armeabi-v7a
          - target: x86_64
            rust-target: x86_64-linux-android
            gradle-arch: x86_64
          - target: i686
            rust-target: i686-linux-android
            gradle-arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
      - run: bun install
      - if: needs.prepare.outputs.is-release != 'true'
        run: |
          sed -i 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/tauri.conf.json
          sed -i 's/namespace = "com.lacrimanstinea.isolde"/namespace = "com.lacrimanstinea.isolde.preview"/g' core/tauri/gen/android/app/build.gradle.kts
          sed -i 's/applicationId = "com.lacrimanstinea.isolde"/applicationId = "com.lacrimanstinea.isolde.preview"/g' core/tauri/gen/android/app/build.gradle.kts
      - if: needs.prepare.outputs.is-release == 'true'
        run: |
          mkdir -p core/tauri/gen/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > core/tauri/gen/android/release.keystore
          cat > core/tauri/gen/android/key.properties << EOF
          storeFile=release.keystore
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Patch for single architecture
        run: |
          cat >> core/tauri/gen/android/app/build.gradle.kts << 'GRADLE'

          android {
              defaultConfig {
                  ndk {
                      abiFilters.clear()
                      abiFilters.add("${{ matrix.gradle-arch }}")
                  }
              }
          }
          GRADLE
      - run: bun --filter @isolde/tauri tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}
          path: |
            core/tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-android-universal:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-universal
      - run: bun install
      - if: needs.prepare.outputs.is-release != 'true'
        run: |
          sed -i 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/tauri.conf.json
          sed -i 's/namespace = "com.lacrimanstinea.isolde"/namespace = "com.lacrimanstinea.isolde.preview"/g' core/tauri/gen/android/app/build.gradle.kts
          sed -i 's/applicationId = "com.lacrimanstinea.isolde"/applicationId = "com.lacrimanstinea.isolde.preview"/g' core/tauri/gen/android/app/build.gradle.kts
      - if: needs.prepare.outputs.is-release == 'true'
        run: |
          mkdir -p core/tauri/gen/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > core/tauri/gen/android/release.keystore
          cat > core/tauri/gen/android/key.properties << EOF
          storeFile=release.keystore
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Patch for universal APK
        run: |
          cat >> core/tauri/gen/android/app/build.gradle.kts << 'GRADLE'

          android {
              defaultConfig {
                  ndk {
                      abiFilters.add("arm64-v8a")
                      abiFilters.add("armeabi-v7a")
                      abiFilters.add("x86_64")
                      abiFilters.add("x86")
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = true
                      if (keystorePropertiesFile.exists()) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }
              applicationVariants.all {
                  val variant = this
                  variant.outputs.all {
                      val output = this as com.android.build.gradle.internal.api.BaseVariantOutputImpl
                      output.outputFileName = "isolde-universal.apk"
                  }
              }
          }
          GRADLE
      - run: bun --filter @isolde/tauri tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: |
            core/tauri/gen/android/app/build/outputs/apk/**/isolde-universal-release.apk

  build-ios:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: bun install
      - if: needs.prepare.outputs.is-release != 'true'
        run: |
          sed -i '' 's/"identifier": "com.lacrimanstinea.isolde"/"identifier": "com.lacrimanstinea.isolde.preview"/g' core/tauri/tauri.conf.json
      - run: bun --filter @isolde/tauri tauri ios build --no-sign
        continue-on-error: true
      - id: find-ios
        run: |
          IPA_PATH=$(find core/tauri/gen/ios/build -name "*.ipa" 2>/dev/null | head -1 || echo "")
          if [ -z "$IPA_PATH" ]; then
            APP_PATH=$(find core/tauri/gen/ios/build -name "*.app" -type d 2>/dev/null | head -1 || echo "")
            if [ -n "$APP_PATH" ]; then
              echo "found-app=true" >> $GITHUB_OUTPUT
              echo "app-path=$APP_PATH" >> $GITHUB_OUTPUT
            else
              echo "found-app=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "found-ipa=true" >> $GITHUB_OUTPUT
            echo "ipa-path=$IPA_PATH" >> $GITHUB_OUTPUT
          fi
      - if: steps.find-ios.outputs.found-app == 'true'
        run: |
          mkdir -p Payload
          cp -r "${{ steps.find-ios.outputs.app-path }}" Payload/
          zip -r isolde-ios-unsigned.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            **/*.ipa
            core/tauri/gen/ios/build/**/*.app

  release:
    needs:
      - prepare
      - build-macos
      - build-linux
      - build-windows
      - build-android-split
      - build-android-universal
      - build-ios
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.is-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - run: |
          mkdir -p release
          find artifacts/macos-universal -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/linux -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/windows -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/android-universal -type f -name "*.apk" -exec cp {} release/isolde-android-universal.apk \; 2>/dev/null || true
          for arch in aarch64 armv7 x86_64 i686; do
            find "artifacts/android-${arch}" -type f -name "*.apk" -exec cp {} release/isolde-android-${arch}.apk \; 2>/dev/null || true
          done
          find artifacts/ios -type f \( -name "*.ipa" -o -name "*.app" \) -exec cp {} release/ \; 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Isolde ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs:
      - prepare
      - build-macos
      - build-linux
      - build-windows
      - build-android-split
      - build-android-universal
      - build-ios
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.is-release != 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          echo "Preview build artifacts:"
          find artifacts -type f | sort
